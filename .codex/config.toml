# Project config for the Codex manager.
# Codex loads this file only after you trust this folder (it asks the first time
# you run codex here).
#
# Codex may read the whole project but write only in managers/codex/.
# It may never read managers/claude/, so the two plans stay independent. On Windows
# the sandbox enforces this with a lasting folder permission, so it also holds for
# the merge and decide runs Claude starts (scripts/codex-call.ps1). Those runs read
# Claude's plan and asks from managers/shared/phase-N/, which Claude fills only
# after both plans are DONE.
# The two helpers (phase_researcher and phase_reviewer in .codex/agents/) are
# subagents: they inherit these permissions, because a custom agent file can't
# change sandbox or approval settings. They run one after the other, never together.

default_permissions = "codex-planner"
approval_policy = "on-request"

# The researcher looks things up on the web (official docs, libraries).
# "live" fetches current pages; "cached" is the default and uses an index.
# Root keys like this one must stay above the [tables] below.
web_search = "live"

[agents]
max_concurrent_threads_per_session = 1

[permissions.codex-planner]
description = "Planning only: read the project, write only managers/codex/."
extends = ":read-only"

[permissions.codex-planner.filesystem.":workspace_roots"]
"managers/codex" = "write"
"managers/claude" = "deny"
"archive" = "deny"
".env" = "deny"
".env.*" = "deny"
